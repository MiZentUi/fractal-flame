version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - staticcheck
    - govet
    - gocritic
    - revive
    - unused
    - gosec
    - depguard
    - bodyclose
    - asciicheck
    - cyclop
    - dupl
    - ineffassign
    - unparam
    - errorlint
    - errname
    - forbidigo
    - contextcheck
  disable:
    - gocyclo
    - lll

  settings:
    gosec:
      config:
        global:
          audit: true
          show-ignored: true
        severity: "medium"
        confidence: "medium"
      excludes:
        - G706
        - G115
        - G102
        - G117
    cyclop:
      max-complexity: 20
    depguard:
      rules:
        main:
          deny:
            - pkg: io/ioutil
    revive:
      severity: warning
    forbidigo:
      exclude-godoc-examples: true
      analyze-types: true
      forbid:
        - pattern: '^fmt\.Print.*$'
        - pattern: '^time\.Sleep$'
        - pattern: '^http\.DefaultClient$'

  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters:
          - cyclop
          - dupl
          - gosec

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gofumpt:
      extra-rules: true
    gci:
      sections:
        - Standard
        - Default
        - Prefix(github.com/mizentui/fractal-flame/iam)
      no-inline-comments: false
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true
output:
  formats:
    text:
      print-linter-name: true
      print-issued-lines: true
      colors: true
run:
  timeout: 5m
  relative-path-mode: gomod
  issues-exit-code: 1
  tests: true
  modules-download-mode: readonly
