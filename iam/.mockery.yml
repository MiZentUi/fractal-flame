all: false
dir: "{{.InterfaceDir}}/mock"
filename: "mock_{{.InterfaceName | snakecase}}.go"
force-file-write: true
formatter: goimports
formatter-options:
  goimports:
    all-errors: false
    comments: true
    format-only: true
    fragment: false
    local-prefix: ""
    tab-indent: true
    tab-width: 8
generate: true
include-auto-generated: false
log-level: debug
structname: "{{.InterfaceName}}{{.Mock}}"
pkgname: "mock"
recursive: false
require-template-schema-exists: true
template: testify
template-schema: "{{.Template}}.schema.json"
packages:
  github.com/mizentui/fractal-flame/iam/internal/service/auth:
    config:
      all: true

  github.com/mizentui/fractal-flame/iam/internal/service/user:
    config:
      all: true

  github.com/mizentui/fractal-flame/iam/internal/service/image:
    config:
      all: true

  github.com/mizentui/fractal-flame/iam/internal/api/v1:
    config:
      all: true
