version: "3"

vars:
  GO_VERSION: "v1.26.1"
  GOLANGCI_LINT_VERSION: "v2.11.4"
  GCI_VERSION: "v0.14.0"
  GOFUMPT_VERSION: "v0.9.2"
  BUF_VERSION: "v1.68.3"
  EASYP_VERSION: "v0.16.6"
  PROTOC_GEN_GO_VERSION: "v1.36.11"
  PROTOC_GEN_GO_GRPC_VERSION: "v1.6.2"

  BIN_DIR: "{{.ROOT_DIR}}/bin"
  GOLANGCI: "{{.BIN_DIR}}/golangci-lint"
  GOFUMPT: "{{.BIN_DIR}}/gofumpt"
  GCI: "{{.BIN_DIR}}/gci"
  EASYP: "{{.BIN_DIR}}/easyp"
  HIDDEN_EASYP: "{{.BIN_DIR}}/.easyp"
  PROTOC_GEN_GO: "{{.BIN_DIR}}/protoc-gen-go"
  PROTOC_GEN_GO_GRPC: "{{.BIN_DIR}}/protoc-gen-go-grpc"

  MODULES: [iam]

tasks:
  create:bin:
    desc: "Create bin directory"
    cmds:
      - echo "Create bin directory..."
      - mkdir "{{.BIN_DIR}}"
    status:
      - test -d "{{.BIN_DIR}}"

  install:golangci-lint:
    desc: "Install golangci-lint bin"
    deps: [create:bin]
    cmds:
      - echo "Install golangci-lint..."
      - GOBIN="{{.BIN_DIR}}" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@"{{.GOLANGCI_LINT_VERSION}}"

    status:
      - test -x "{{.GOLANGCI_LINT}}"

  install:formaters:
    desc: "Install gofumpt bin"
    deps: [create:bin]
    cmds:
      - echo "Install gofumpt..."
      - GOBIN="{{.BIN_DIR}}" go install mvdan.cc/gofumpt@"{{.GOFUMPT_VERSION}}"
      - GOBIN="{{.BIN_DIR}}" go install github.com/daixiang0/gci@"{{.GCI_VERSION}}"

    status:
      - test -x "{{.GOFUMPT}}"
      - test -x "{{.GCI}}"

  install:easyp:
    desc: "Install EasyP bin"
    deps: [create:bin]
    cmds:
      - echo "Installing EasyP..."
      - GOBIN="{{.BIN_DIR}}" go install github.com/easyp-tech/easyp/cmd/easyp@"{{.EASYP_VERSION}}"
    status:
      - test -x "{{.EASYP}}"

  install:protoc-gen-go:
    desc: "Install protoc-gen-go"
    deps: [create:bin]
    cmds:
      - echo "Installing protoc gen go..."
      - GOBIN="{{.BIN_DIR}}" go install google.golang.org/protobuf/cmd/protoc-gen-go@"{{.PROTOC_GEN_GO_VERSION}}"
    status:
      - test -x "{{.PROTOC_GEN_GO}}"

  install:protoc-gen-go-grpc:
    desc: "Installing protoc-gen-go-grpc plugin in bin directory"
    deps: [create:bin]
    cmds:
      - echo "Installing protoc-gen-go-grpc..."
      - GOBIN="{{.BIN_DIR}}" go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@"{{.PROTOC_GEN_GO_GRPC_VERSION}}"
    status:
      - test -x "{{.PROTOC_GEN_GO_GRPC}}"

  lint:
    desc: "Run golangci-lint on the all modules"
    deps: [install:golangci-lint]
    cmds:
      - cmd: echo "Linting all modules..."
      - for: { var: MODULES, as: MOD }
        cmd: "{{.GOLANGCI_LINT}} run {{.MOD}}/... --config=.golangci.yml"
        if: '[ -d "{{.MOD}}" ] && {{ne .MOD "shared" }}'

  format:
    desc: "Formatting all projects with gofumpt + gci, exclude mocks"
    deps: [install:formaters]
    cmds:
      - cmd: echo "Formatting all modules..."
      - for: { var: MODULES, as: MOD }
        cmd: 'find {{.MOD}} -type f -name ''*.go'' ! -path ''*/mocks/*'' -exec sh -c ''{{.GOFUMPT}} -extra -w "$@" && {{.GCI}} write -s standard -s default -s "prefix(github.com/ekuzm/rocket-factory)" "$@"'' sh {} +'
        if: ' [ -d "{{.MOD}}" ] && {{ne .MOD "shared"}}'

  generate:code:
    desc: "Generating code from ProtoBuf declaration"
    dir: ./api
    deps: [install:easyp, install:protoc-gen-go, install:protoc-gen-go-grpc]
    cmds:
      - cmd: echo "Generating code..."
      - cmd: rm -rf "{{.HIDDEN_EASYP}}"
        if: '[ -x "{{.HIDDEN_EASYP}}" ]'
      - cmd: PATH="{{.BIN_DIR}}:$PATH" "{{.EASYP}}" --cfg ./easyp.yaml mod download
      - cmd: PATH="{{.BIN_DIR}}:$PATH" "{{.EASYP}}" --cfg ./easyp.yaml generate
