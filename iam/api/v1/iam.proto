syntax = "proto3";

package iam.v1;

import "google/protobuf/wrappers.proto";
import "validate/validate.proto";

option go_package = "github.com/ekuzm/fractal-flame/iam/pkg/proto/iam/v1;iamv1";

service IAMService {
  rpc Register(AuthRequest) returns (RegisterResponse);
  rpc Login(AuthRequest) returns (LoginResponse);
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc GetImage(GetImageRequest) returns (GetImageResponse);
}

message AuthRequest {
  string username = 1 [
    (validate.rules).string.min_len = 3,
    (validate.rules).string.max_len = 50
  ];
  string password = 2 [(validate.rules).string.max_len = 72];
}

message RegisterResponse {
  int64 user_id = 1;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message RefreshRequest {
  string refresh_token = 1 [(validate.rules).string.max_len = 72];
}

message RefreshResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message GetUserRequest {
  int64 user_id = 1 [(validate.rules).int64.gt = 0];
}

message User {
  int64 user_id = 1;
  string username = 2;
  string image = 3;
}

message GetUserResponse {
  User user = 1;
}

message UpdateUserRequest {
  google.protobuf.StringValue username = 1;
  google.protobuf.StringValue password = 2;
  google.protobuf.StringValue image = 3;
}

message UpdateUserResponse {
  User user = 1;
}

message GetImageRequest {
  string name = 1 [(validate.rules).string.min_len = 1];
}

message GetImageResponse {
  bytes image = 1;
}
