lint:
  use:
    - DEFAULT
  enum_zero_value_suffix: _UNSPECIFIED
  service_suffix: Service
  ignore:
    - github.com

deps:
  - github.com/googleapis/googleapis                         

generate:
  inputs:
    - directory: "v1"
      
  plugins:
    - name: go
      out: ../pkg/proto
      opts:
        paths: source_relative
    - name: go-grpc
      out: ../pkg/proto
      opts:
        paths: source_relative
        require_unimplemented_servers: false

breaking:
  use:
      - DIRECTORY_SAME_PACKAGE
      - PACKAGE_DEFINED
      - FIELD_LOWER_SNAKE_CASE
      - MESSAGE_PASCAL_CASE