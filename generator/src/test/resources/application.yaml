spring:
  application:
    name: generator
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_URL:localhost:5432}/generator
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
  liquibase:
    enabled: false

app:
  generator:
    count: 3
    threads: 4
    max-width: 2000
    max-height: 2000
    max-iterations: 100000000

server:
  ssl:
    enabled: false
